<header class="site-header">
  <div class="container nav-container">
    <a href="{{ '/' | relative_url }}" class="site-logo">Brunaugh Lab</a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="site-nav">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      <a href="{{ '/approach/' | relative_url }}" {% if page.url contains '/approach' %}class="active"{% endif %}>How We Think</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}class="active"{% endif %}>Research</a>
      <a href="{{ '/people/' | relative_url }}" {% if page.url contains '/people' %}class="active"{% endif %}>People</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publications' %}class="active"{% endif %}>Publications</a>
      <a href="{{ '/software/' | relative_url }}" {% if page.url contains '/software' %}class="active"{% endif %}>Open Source Tools</a>
      <a href="{{ '/opportunities/' | relative_url }}" {% if page.url contains '/opportunities' %}class="active"{% endif %}>Opportunities</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
  <nav class="topic-nav" aria-label="Research topics">
    <div class="container topic-nav-inner">
      <a href="{{ '/research/barrier-cartography/' | relative_url }}" {% if page.url contains '/research/barrier-cartography' %}class="active" aria-current="page"{% endif %}>Barrier Cartography</a>
      <a href="{{ '/research/mucus-barrier-modulation/' | relative_url }}" {% if page.url contains '/research/mucus-barrier-modulation' %}class="active" aria-current="page"{% endif %}>Mucus Modulation</a>
      <a href="{{ '/research/respiratory-infection-biology/' | relative_url }}" {% if page.url contains '/research/respiratory-infection-biology' %}class="active" aria-current="page"{% endif %}>Infection Biology</a>
      <a href="{{ '/research/spatiotemporal-synergy/' | relative_url }}" {% if page.url contains '/research/spatiotemporal-synergy' %}class="active" aria-current="page"{% endif %}>Antibiotic Synergy</a>
      <a href="{{ '/research/protecting-labile-payloads/' | relative_url }}" {% if page.url contains '/research/protecting-labile-payloads' %}class="active" aria-current="page"{% endif %}>Particle Engineering</a>
      <a href="{{ '/research/inhaled-product-performance/' | relative_url }}" {% if page.url contains '/research/inhaled-product-performance' %}class="active" aria-current="page"{% endif %}>Product Performance</a>
    </div>
  </nav>
</header>
<script>
document.querySelector('.nav-toggle').addEventListener('click', function() {
  var nav = document.getElementById('site-nav');
  var expanded = this.getAttribute('aria-expanded') === 'true';
  this.setAttribute('aria-expanded', !expanded);
  nav.classList.toggle('open');
});

document.querySelectorAll('#site-nav a').forEach(function(link) {
  link.addEventListener('click', function() {
    document.querySelector('.nav-toggle').setAttribute('aria-expanded', 'false');
    document.getElementById('site-nav').classList.remove('open');
  });
});

var activeTopic = document.querySelector('.topic-nav a.active');
if (activeTopic) {
  activeTopic.scrollIntoView({ block: 'nearest', inline: 'center' });
}
</script>
